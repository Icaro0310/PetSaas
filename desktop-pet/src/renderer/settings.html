<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>PetDeskSaas</title>
    <style>
      body {
        font: 13px/1.5 "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        background: #1e1e28;
        color: #e8e8f0;
        user-select: none;
      }
      h1 { font-size: 15px; margin: 0 0 12px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
      }
      .row label { flex: 1; }
      input[type="range"] { width: 130px; }
      .val { width: 40px; text-align: right; opacity: 0.7; }
      select {
        background: #2a2a38;
        color: #e8e8f0;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 3px 6px;
      }
      .sep { border-top: 1px solid #333; margin: 8px 0; }
      button {
        background: #2a2a38;
        color: #e8e8f0;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover { background: #353548; }
    </style>
  </head>
  <body>
    <h1>PetDeskSaas</h1>

    <div class="row">
      <label for="pet">Pet</label>
      <select id="pet"></select>
    </div>
    <div class="row">
      <button id="install">Instalar .petpack...</button>
      <button id="remove">Remover pet</button>
    </div>
    <div class="row" id="petMsg" style="opacity: 0.7; font-size: 11px"></div>
    <div class="row">
      <label for="scale">Escala</label>
      <input id="scale" type="range" min="0.5" max="3" step="0.1" />
      <span class="val" id="scaleVal"></span>
    </div>
    <div class="row">
      <label for="opacity">Opacidade</label>
      <input id="opacity" type="range" min="0.5" max="1" step="0.05" />
      <span class="val" id="opacityVal"></span>
    </div>
    <div class="sep"></div>
    <div class="row">
      <label for="top">Sempre no topo</label>
      <input id="top" type="checkbox" />
    </div>
    <div class="row">
      <label for="pass">Mouse passthrough</label>
      <input id="pass" type="checkbox" />
    </div>
    <div class="row">
      <label for="lock">Bloquear arrasto</label>
      <input id="lock" type="checkbox" />
    </div>
    <div class="row">
      <label for="pause">Pausar interacoes</label>
      <input id="pause" type="checkbox" />
    </div>
    <div class="row">
      <label for="login">Iniciar com o Windows</label>
      <input id="login" type="checkbox" />
    </div>
    <div class="sep"></div>
    <div class="row">
      <label for="lang">Idioma</label>
      <select id="lang">
        <option value="pt">Português</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="row">
      <label for="token">PetSaas token (Clerk)</label>
    </div>
    <div class="row">
      <input
        id="token"
        type="password"
        placeholder="session token"
        style="flex: 1; background: #2a2a38; color: #e8e8f0; border: 1px solid #444; border-radius: 4px; padding: 4px 6px"
      />
      <button id="sync">Sincronizar</button>
    </div>
    <div class="row" id="syncMsg" style="opacity: 0.7; font-size: 11px"></div>
    <div class="sep"></div>
    <div class="row">
      <button id="reset">Resetar posicao</button>
      <button id="quit">Sair</button>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
