name: Keep Supabase and GitHub Active

on:
  schedule:
    # Ping ao Supabase: a cada 6 horas
    - cron: '0 */6 * * *'
    # Commit mensal para manter o repositorio ativo (GitHub desativa workflows agendados apos 60 dias sem atividade)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep_alive via Supabase REST
        run: |
          echo "Pinging Supabase to prevent auto-pause..."
          response=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $response"
          cat /tmp/response.txt
          if [ "$response" != "200" ]; then
            echo "Supabase ping failed!"
            exit 1
          fi
          echo "Supabase is active."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  keepalive:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update keepalive file
        id: keepalive
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/LAST_GITHUB_ACTIVITY
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/LAST_GITHUB_ACTIVITY
          if ! git diff --cached --quiet; then
            git commit -m "chore: keep repository active [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push keepalive commit
        if: steps.keepalive.outputs.committed == 'true'
        run: git push
