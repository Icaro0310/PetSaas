name: Weekly Keep-Alive Report

on:
  schedule:
    # Domingo, 10:00 UTC (report da semana anterior)
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  MAILERSEND_API_TOKEN: ${{ secrets.MAILERSEND_API_TOKEN }}
  MAILERSEND_FROM_DOMAIN: ${{ secrets.MAILERSEND_FROM_DOMAIN }}
  MAILERSEND_TO_EMAIL: ${{ secrets.MAILERSEND_TO_EMAIL }}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Gather keep-alive runs
        id: report
        run: |
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/keep-supabase-active.yml/runs?created=>=$since&per_page=100" --jq '.workflow_runs')
          total=$(echo "$runs" | jq 'length')
          passed=$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')
          failed=$(echo "$runs" | jq '[.[] | select(.conclusion == "failure")] | length')
          cancelled=$(echo "$runs" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          skipped=$(echo "$runs" | jq '[.[] | select(.conclusion == "skipped")] | length')
          other=$((total - passed - failed - cancelled - skipped))

          html="<h2>PetSaas - Relatorio Semanal Keep-Alive</h2>"
          html="$html<p>Periodo: $since ate agora</p>"
          html="$html<table border='1' cellpadding='8' style='border-collapse:collapse'>"
          html="$html<tr><th>Status</th><th>Quantidade</th></tr>"
          html="$html<tr style='background:#d4edda'><td>Passed</td><td>$passed</td></tr>"
          html="$html<tr style='background:#f8d7da'><td>Failed</td><td>$failed</td></tr>"
          html="$html<tr><td>Cancelled</td><td>$cancelled</td></tr>"
          html="$html<tr><td>Skipped</td><td>$skipped</td></tr>"
          html="$html<tr><td>Other</td><td>$other</td></tr>"
          html="$html<tr style='font-weight:bold'><td>Total</td><td>$total</td></tr>"
          html="$html</table>"
          html="$html<p>Repositorio: https://github.com/${{ github.repository }}/actions</p>"

          if [ "$failed" -gt 0 ]; then
            html="$html<p style='color:red;font-weight:bold'>ATENCAO: $failed execucao(oes) falharam. Verifique os logs.</p>"
          else
            html="$html<p style='color:green;font-weight:bold'>Todas as execucoes da semana foram bem-sucedidas.</p>"
          fi

          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "$html"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send report via MailerSend
        if: env.MAILERSEND_API_TOKEN != ''
        env:
          HTML_BODY: ${{ steps.report.outputs.body }}
          TOTAL: ${{ steps.report.outputs.total }}
          FAILED: ${{ steps.report.outputs.failed }}
        run: |
          payload=$(jq -n \
            --arg from_email "petsaas@${MAILERSEND_FROM_DOMAIN}" \
            --arg from_name "PetSaas Bot" \
            --arg to_email "${MAILERSEND_TO_EMAIL}" \
            --arg to_name "Icaro" \
            --arg subject "[PetSaas] Relatorio Semanal Keep-Alive - ${TOTAL} runs, ${FAILED} failed" \
            --arg html "$HTML_BODY" \
            '{
              from: {email: $from_email, name: $from_name},
              to: [{email: $to_email, name: $to_name}],
              subject: $subject,
              html: $html
            }')
          http_code=$(printf '%s' "$payload" | curl -sS -X POST "https://api.mailersend.com/v1/email" \
            -H "Authorization: Bearer ${MAILERSEND_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- \
            -o /tmp/mailersend-response.json -w "%{http_code}")
          echo "HTTP status: $http_code"
          cat /tmp/mailersend-response.json
          if [ "$http_code" = "202" ]; then
            echo "Email enviado com sucesso"
          else
            echo "Erro no envio (HTTP $http_code):"
            exit 1
          fi

      - name: Warn if MailerSend token is missing
        if: env.MAILERSEND_API_TOKEN == ''
        run: |
          echo "::warning:: MAILERSEND_API_TOKEN nao configurado. O relatorio foi gerado, mas nao enviado."
