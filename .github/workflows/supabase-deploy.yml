name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: false

      - name: Deploy edge functions
        run: |
          supabase functions deploy notify-pet-found --no-verify-jwt
          supabase functions deploy notify-dose-missed --no-verify-jwt
          supabase functions deploy clerk-webhook --no-verify-jwt
          supabase functions deploy health --no-verify-jwt
          supabase functions deploy delete-user-account --no-verify-jwt
          supabase functions deploy subscribe --no-verify-jwt
          supabase functions deploy petdesk-generate --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload petpack library (se existir service role)
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Sem SUPABASE_SERVICE_ROLE_KEY — a saltar upload de petpacks"
            exit 0
          fi
          python desktop-pet/tools/upload_petpacks.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
