name: Website E2E (Playwright)

# Suite UAT diaria contra o site em producao + Edge Functions.
# Falha => check vermelho no repo + artefactos com report/traces.

on:
  schedule:
    - cron: '17 6 * * *' # diariamente 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'e2e/**'
      - '.github/workflows/website-e2e.yml'

concurrency:
  group: website-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright UAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (live site)
        working-directory: e2e
        run: npx playwright test
        env:
          SITE_URL: https://icaro0310.github.io/PetSaas
          APP_URL: https://icaro0310.github.io/PetSaas/app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/results/
          retention-days: 14
          if-no-files-found: ignore
