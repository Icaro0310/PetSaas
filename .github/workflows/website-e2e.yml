name: Website E2E (Cypress)

# Suite UAT diaria contra o site em producao + Edge Functions.
# Cypress e a suite principal; Playwright corre como fallback para os
# cenarios que o Cypress nao consegue executar (pagina sem JavaScript).
# Falha => check vermelho no repo + artefactos com screenshots/videos.

on:
  schedule:
    - cron: '17 6 * * *' # diariamente 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'e2e/**'
      - '.github/workflows/website-e2e.yml'

concurrency:
  group: website-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Cypress UAT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cypress E2E (suite principal)
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          browser: chrome
        env:
          SITE_URL: https://icaro0310.github.io/PetSaas
          APP_URL: https://icaro0310.github.io/PetSaas/app

      - name: Playwright fallback (sem JavaScript)
        working-directory: e2e
        # Cross-check: o fallback usa o Chrome do sistema — sem playwright install.
        run: npx playwright test
        env:
          SITE_URL: https://icaro0310.github.io/PetSaas

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            e2e/cypress/screenshots/
            e2e/cypress/videos/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
