<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PetCare: registos de medicação, cuidadores e identificação do animal por QR Code.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PetCare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PetCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">

  <!-- SPA redirect (GitHub Pages): o 404.html do site transforma
       /PetSaas/app/<rota> em /PetSaas/app/?p=<rota>; aqui restauramos
       a URL limpa antes do bootstrap do Flutter (path URL strategy). -->
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search).get('p');
      if (p) window.history.replaceState(null, '', p);
    })();
  </script>

  <script defer src="clerk_web_bridge.js"></script>

  <!-- Passkeys Web SDK: exigido por passkeys_web (dep. de clerk_flutter).
       Sem este script, o bootstrap da app falha com undefined.init. -->
  <script src="passkeys_bundle.js"></script>

  <!-- posthog-js: exigido por posthog_flutter na web (window.posthog) -->
  <script src="https://eu-assets.i.posthog.com/static/array.js" async></script>
  <script>
    window.addEventListener('load', function () {
      if (window.posthog && !window.posthog.__loaded) {
        window.posthog.init('phc_yUpratCpKeH3Nqgd7bmKmBZBhXa5d7D4WVwXUBiiqQYx', {
          api_host: 'https://eu.i.posthog.com',
          person_profiles: 'identified_only'
        });
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
