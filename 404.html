<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada - PetCare</title>
  <script>
    // SPA fallback para a app Flutter em /PetSaas/app/: o GitHub Pages
    // nao tem fallback nativo, entao rotas como /PetSaas/app/login caem
    // aqui. Redirecionamos para a app com a rota em ?p= - o index.html
    // da app restaura a URL original via history.replaceState.
    (function () {
      var prefix = '/PetSaas/app';
      var loc = window.location;
      if (loc.pathname === prefix || loc.pathname.indexOf(prefix + '/') === 0) {
        var target = loc.pathname + loc.search + loc.hash;
        window.location.replace(prefix + '/?p=' + encodeURIComponent(target));
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "DM Sans", system-ui, sans-serif; display: flex; min-height: 100dvh;
           align-items: center; justify-content: center; background: #F6F3EA; color: #182A23; margin: 0; }
    .box { text-align: center; padding: 2rem; }
    h1 { font-family: "Fraunces", Georgia, serif; font-size: clamp(2.2rem, 6vw, 3.5rem); line-height: 1.08; margin: 0 0 .5rem; }
    a { color: #143D33; font-weight: 700; }
    a:focus-visible { outline: 3px solid #143D33; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Página não encontrada</h1>
    <p>O endereço que procura não existe ou foi movido.</p>
    <p><a href="/PetSaas/">Voltar ao início</a></p>
  </div>
</body>
</html>
